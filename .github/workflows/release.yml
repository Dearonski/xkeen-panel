name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          LDFLAGS: -s -w -X xkeen-panel/internal/version.Version=${{ github.ref_name }}
        run: |
          # aarch64 (Keenetic Giga, Ultra, Peak, Hopper and others)
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o build/xkeen-panel-aarch64 .

          # mipsel (older Keenetic series)
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -trimpath -ldflags="$LDFLAGS" -o build/xkeen-panel-mipsel .

      # The panel refuses to update itself from a release without this file
      - name: Checksums
        run: cd build && sha256sum xkeen-panel-aarch64 xkeen-panel-mipsel > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/xkeen-panel-aarch64
            build/xkeen-panel-mipsel
            build/SHA256SUMS
