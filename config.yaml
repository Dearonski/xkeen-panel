# Web panel port
port: 3000

# Data directory (user.json, subscription.json)
data_dir: /opt/etc/xkeen-panel/data

# === XKeen/Xray paths ===
# The layout is detected automatically: XKeen 2.x (S05xkeen) and 1.x (S24xray),
# the core (xray/mihomo) and the proxying mode. Set anything below only for a
# non-standard install.
xkeen_path: /opt/sbin/xkeen
outbounds_file: /opt/etc/xray/configs/04_outbounds.json
# xray_config_dir: /opt/etc/xray/configs
# routing_file: /opt/etc/xray/configs/05_routing.json
# mihomo_config: /opt/etc/mihomo/config.yaml
# xkeen_json: /opt/etc/xkeen/xkeen.json
# xray_api_addr: 127.0.0.1:10085

# === Watchdog ===
check_interval: 120        # Check interval, seconds
check_url: https://www.google.com
max_fails: 3               # Consecutive failures before switching

# Watchdog log file
log_file: /opt/var/log/xkeen-panel.log

# === Autopilot ===
probe_timeout_ms: 2000          # TCP ping timeout per server
probe_concurrency: 20           # Concurrent ping limit (matters on a router)
latency_auto_switch: true       # Switch on high latency, not only on a dropped link
latency_threshold_ms: 1000      # High latency threshold
latency_switch_count: 3         # Consecutive checks above the threshold before switching
blacklist_ttl_sec: 300          # How long a server stays excluded after a failover
watchdog_auto_start: true       # Start the watchdog automatically on boot

# Subscription auto-refresh (seconds, 0 = off). In pool mode the same timer
# brings the pool in line with the subscription: providers rotate servers, and a
# stale pool sends traffic to dead nodes. The update is applied through the Xray
# api without a restart, so the interval can stay short.
subscription_refresh_interval: 1800

# How many nodes the balancer pool holds. Xray probes every node separately
# (observatory), so a pool of the whole subscription means constant handshakes
# on the router. The panel takes the lowest-latency ones, excluding countries
# from auto_switch_avoid_countries.
pool_max_nodes: 10

# Traffic is pinned to one pool node: the balancer picks an outbound per
# connection, so the external IP keeps moving — Telegram sessions drop and CDNs
# answer 403. The panel probes real services through the active node and
# replaces it once several of them stop working through it.
health_check_every: 5           # Probe every N watchdog cycles
health_fail_threshold: 2        # Consecutive failures of one service to count it as broken
health_quorum: 2                # How many services must fail before the node is replaced
# The check replaces the node at most once every 30 minutes: a service that
# blocks every datacenter IP would otherwise cycle the pool forever.
# health_check_urls:            # default: cloudflare, telegram, youtube, soundcloud
#   - https://www.cloudflare.com/cdn-cgi/trace
#   - https://web.telegram.org/

# === Geo-avoidance for automatic switching ===
# Reuses the geoip.dat already installed for Xray
geoip_path: /opt/etc/xray/dat/geoip_v2fly.dat
auto_switch_avoid_countries:    # Never switch automatically to servers in these countries
  - RU
  - BY

# Trust proxy headers (X-Forwarded-For/Host/Proto). Enable ONLY when the panel
# sits behind a trusted HTTPS proxy that rewrites them. Affects rate limiting
# (otherwise the IP can be spoofed) and passkey RP derivation.
trust_proxy_headers: false

# === Passkey (WebAuthn) ===
# Setting the domain is enough — passkeys are then allowed on the standard
# KeenDNS HTTPS ports (443 without a port + 8443/5443/8083/5083/65083), so they
# work both locally and through the cloud on :8443.
# webauthn_rp_id: xkeen.superwifi.netcraze.link
# webauthn_rp_name: XKeen Panel
# webauthn_origins:        # optional — override the origin list by hand
#   - https://xkeen.superwifi.netcraze.link
# If the domain cannot be set — trust_proxy_headers: true, and the RP is derived
# from X-Forwarded-Host (only behind a trusted proxy!).
